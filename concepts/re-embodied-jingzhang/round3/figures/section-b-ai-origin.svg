<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="1200" height="720" fill="#f8f6f0"/>
<text x="50" y="48" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#263238">B · AI Origin — civic task and learning front / 公共任务与学习前台</text>
<text x="50" y="80" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#546e7a">How can optional AI service enter daily learning/community life without colonising it?</text>
<line x1="50" y1="505" x2="1150" y2="505" stroke="#455a64" stroke-width="3"/>
<rect x="50" y="245" width="260" height="260" rx="5" fill="#d7d2c8" stroke="#455a64" stroke-width="1.5"/>
<text x="60" y="270" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#263238">Quiet learning/residential edge</text>
<text x="60" y="292" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#455a64">ordinary rooms above · no heavy backend</text>
<rect x="310" y="330" width="235" height="175" rx="5" fill="#a7c7e7" stroke="#455a64" stroke-width="1.5"/>
<text x="320" y="355" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#263238">Ordinary civic room</text>
<text x="320" y="377" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#455a64">human service · paper/phone · meeting</text>
<rect x="545" y="365" width="145" height="140" rx="5" fill="#f3cf7a" stroke="#455a64" stroke-width="1.5"/>
<text x="555" y="390" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#263238">Optional interface</text>
<text x="555" y="412" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#455a64">task script · status · complaint</text>
<rect x="690" y="395" width="135" height="110" rx="5" fill="#d99f7e" stroke="#455a64" stroke-width="1.5"/>
<text x="700" y="420" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#263238">Light local cell</text>
<text x="700" y="442" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#455a64">locker · safe return · offline stop</text>
<rect x="825" y="420" width="115" height="85" rx="5" fill="#aab7b8" stroke="#455a64" stroke-width="1.5"/>
<text x="835" y="445" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#263238">Back-of-house</text>
<text x="835" y="467" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#455a64">ordinary operations access</text>
<rect x="940" y="350" width="210" height="155" rx="5" fill="#9ac7a5" stroke="#455a64" stroke-width="1.5"/>
<text x="950" y="375" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#263238">Shade + public refuge</text>
<text x="950" y="397" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#455a64">accessible walk remains when closed</text>
<rect x="50" y="550" width="260" height="52" fill="#e4dfd6" stroke="#78909c"/>
<text x="58" y="581" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#263238">quiet threshold</text>
<rect x="310" y="550" width="380" height="52" fill="#d8e6d5" stroke="#78909c"/>
<text x="318" y="581" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#263238">accessible ordinary public walk</text>
<rect x="690" y="550" width="250" height="52" fill="#c9ccce" stroke="#78909c"/>
<text x="698" y="581" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#263238">small service access — no technical yard</text>
<rect x="940" y="550" width="210" height="52" fill="#a8d5ba" stroke="#78909c"/>
<text x="948" y="581" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#263238">shade / rain refuge</text>
<rect x="50" y="625" width="1100" height="48" rx="6" fill="#fff3cd" stroke="#d6b656"/>
<text x="65" y="655" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#6d4c41">AI OFF: civic room and route unchanged · 80% LOWER: remove locker/interface · DIGITAL DOWN: staffed paper/phone service</text>
<text x="50" y="700" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#9b2c2c">CONCEPT / NOT OFFICIAL / NOT SITE-CALIBRATED / NOT A CONSTRUCTION DRAWING</text>
</svg>
