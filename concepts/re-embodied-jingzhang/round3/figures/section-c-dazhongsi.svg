<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="1200" height="720" fill="#f8f6f0"/>
<text x="50" y="48" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#263238">C · Dazhongsi — typological metropolitan adoption edge / 都市采用界面原型</text>
<text x="50" y="80" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#546e7a">How can arrival, commerce, service labour and temporary embodied services coexist?</text>
<line x1="50" y1="505" x2="1150" y2="505" stroke="#455a64" stroke-width="3"/>
<rect x="50" y="250" width="260" height="255" rx="5" fill="#d5cbc0" stroke="#455a64" stroke-width="1.5"/>
<text x="60" y="275" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#263238">Commercial / enterprise building</text>
<text x="60" y="297" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#455a64">ordinary active ground floor</text>
<rect x="310" y="345" width="180" height="160" rx="5" fill="#9bc5d9" stroke="#455a64" stroke-width="1.5"/>
<text x="320" y="370" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#263238">Public help + exchange</text>
<text x="320" y="392" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#455a64">human fallback · visitor/service worker</text>
