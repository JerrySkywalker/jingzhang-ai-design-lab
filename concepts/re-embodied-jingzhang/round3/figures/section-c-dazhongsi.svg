<text x="970" y="452" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#455a64">event window · capped demand</text>
<rect x="50" y="550" width="440" height="52" fill="#e4dfd6" stroke="#78909c"/>
<text x="58" y="581" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#263238">active frontage / public help</text>
<rect x="490" y="550" width="290" height="52" fill="#d8e6d5" stroke="#78909c"/>
<text x="498" y="581" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#263238">pedestrian priority + sheltered arrival</text>
<rect x="780" y="550" width="180" height="52" fill="#c0c5c8" stroke="#78909c"/>
<text x="788" y="581" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#263238">managed curb / ordinary logistics</text>
<rect x="960" y="550" width="190" height="52" fill="#b0b5b8" stroke="#78909c"/>
<text x="968" y="581" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#263238">service lane / manual recovery</text>
<rect x="50" y="625" width="1100" height="48" rx="6" fill="#fff3cd" stroke="#d6b656"/>
<text x="65" y="655" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#6d4c41">TYPOLOGY ONLY · AI OFF: ordinary help/loading continue · EVENT: temporary overlay · CELL FAIL: remove equipment, no public repair</text>
<text x="50" y="700" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#9b2c2c">CONCEPT / NOT OFFICIAL / NOT SITE-CALIBRATED / NOT A CONSTRUCTION DRAWING</text>
