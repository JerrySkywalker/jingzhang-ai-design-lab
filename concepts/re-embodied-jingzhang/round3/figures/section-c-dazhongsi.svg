<text x="500" y="415" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#263238">Small recovery room</text>
<text x="500" y="437" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#455a64">temporary holding · no heavy repair</text>
<rect x="630" y="430" width="150" height="75" rx="5" fill="#d8e6d5" stroke="#455a64" stroke-width="1.5"/>
<text x="640" y="455" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#263238">Arrival / refuge</text>
<text x="640" y="477" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#455a64">walking + accessible wait</text>
<rect x="780" y="445" width="180" height="60" rx="5" fill="#bfc5c8" stroke="#455a64" stroke-width="1.5"/>
<text x="790" y="470" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#263238">Managed curb</text>
<text x="790" y="492" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#455a64">ordinary loading / pick-up first</text>
