<text x="955" y="415" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#263238">Drainage / landscape edge</text>
<text x="955" y="437" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#455a64">soil · canopy · overflow kept clear</text>
<rect x="50" y="550" width="350" height="52" fill="#d8e6d5" stroke="#78909c"/>
<text x="58" y="581" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#263238">ordinary pedestrian / cycle approach</text>
<rect x="400" y="550" width="375" height="52" fill="#d5d8dc" stroke="#78909c"/>
<text x="408" y="581" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#263238">controlled court — no public through-route</text>
<rect x="775" y="550" width="175" height="52" fill="#bfc5c8" stroke="#78909c"/>
<text x="783" y="581" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#263238">technical logistics</text>
<rect x="950" y="550" width="200" height="52" fill="#a8d5ba" stroke="#78909c"/>
<text x="958" y="581" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#263238">drainage / canopy refuge</text>
<rect x="50" y="625" width="1100" height="48" rx="6" fill="#fff3cd" stroke="#d6b656"/>
<text x="65" y="655" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#6d4c41">AI OFF: bays serve ordinary maintenance · CELL FAIL: independent shutdown + manual recovery · PEAK: refuse overflow, protect public path</text>
<text x="50" y="700" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#9b2c2c">CONCEPT / NOT OFFICIAL / NOT SITE-CALIBRATED / NOT A CONSTRUCTION DRAWING</text>
