<text x="410" y="370" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#263238">Controlled handoff</text>
<text x="410" y="392" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#455a64">queue cap · supervised transfer</text>
