<text x="560" y="300" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#263238">Two isolated cells</text>
<text x="560" y="322" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#455a64">general bay · recovery · shutdown A/B</text>
<rect x="775" y="300" width="170" height="205" rx="5" fill="#b47d66" stroke="#455a64" stroke-width="1.5"/>
