<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="1200" height="720" fill="#f8f6f0"/>
<text x="50" y="48" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#263238">A · Zhongzhiyuan — productive backend / 生产与验证后端</text>
<text x="50" y="80" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#546e7a">How can R&amp;D, testing and repair coexist with public life, logistics and drainage?</text>
<line x1="50" y1="505" x2="1150" y2="505" stroke="#455a64" stroke-width="3"/>
<rect x="50" y="245" width="205" height="260" rx="5" fill="#c9d6df" stroke="#455a64" stroke-width="1.5"/>
<text x="60" y="270" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#263238">Existing/adapted building</text>
<text x="60" y="292" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#455a64">ordinary R&amp;D + service rooms</text>
<rect x="255" y="330" width="145" height="175" rx="5" fill="#9bc5d9" stroke="#455a64" stroke-width="1.5"/>
